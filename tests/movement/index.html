<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LateForClass Tests</title>
</head>
<body>
    <h1>LateForClass Tests</h1>
    <button id="run" type="button">Run tests</button>
    <pre id="results" role="status"></pre>
    <script src="../../assets/vendor/three-r128/three.min.js"></script>
    <script src="../../assets/vendor/three-r128/GLTFLoader.js"></script>
    <script src="../../assets/gameConfig.js"></script>
    <script src="../../js/controls.js"></script>
    <script src="../../js/Wall.js"></script>
    <script src="../../js/EnvironmentObjectFactory.js?v=20261124-195"></script>
    <script src="../../js/ModelCache.js"></script>
    <script src="../../js/LightingManager.js?v=20261124-195"></script>
    <script src="../../js/SchoolDefinition.js?v=20261124-207"></script>
    <script src="../../js/Level.js?v=20261124-207"></script>
    <script src="../../js/World.js?v=20261124-207"></script>
    <script src="../../js/Player.js"></script>
    <script src="../../js/SchoolClock.js"></script>
    <script src="../../js/GameSession.js?v=20261123-2"></script>
    <script src="test-movement.js?v=20261124-195"></script>
    <script src="test-world.js"></script>
    <script src="test-first-court.js?v=20261124-207"></script>
    <script>
        const button = document.getElementById('run');
        const results = document.getElementById('results');

        button.addEventListener('click', async () => {
            button.disabled = true;
            try {
                const response = await fetch('../../assets/levels.json');
                if (!response.ok) {
                    throw new Error(`Could not load level data (${response.status})`);
                }
                const { levels } = await response.json();
                const cache = new ModelCache('../../assets/levels.json');
                await cache.prepare(levels[2]);
                const reports = [];
                registerMovementTests((name, run) => {
                    try {
                        run();
                        reports.push(`PASS  ${name}`);
                    } catch (error) {
                        reports.push(`FAIL  ${name}\n      ${error.message}`);
                    }
                }, levels, cache.modelsFor(levels[2]));
                cache.dispose();
                const cases = [];
                registerWorldTests((name, run) => cases.push({ name, run }), levels, '../../assets/levels.json');
                const schoolUrl = new URL(levels.find(level => level.id === 4).schoolFile, response.url);
                const schoolResponse = await fetch(schoolUrl);
                if (!schoolResponse.ok) {
                    throw new Error(`Could not load First Court (${schoolResponse.status})`);
                }
                registerFirstCourtTests((name, run) => cases.push({ name, run }),
                    await schoolResponse.json(), '../../assets/levels.json');
                for (const { name, run } of cases) {
                    try {
                        await run();
                        reports.push(`PASS  ${name}`);
                    } catch (error) {
                        reports.push(`FAIL  ${name}\n      ${error.message}`);
                    }
                }
                results.textContent = reports.join('\n');
            } catch (error) {
                results.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
