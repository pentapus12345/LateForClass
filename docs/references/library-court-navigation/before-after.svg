<text x="40" y="692" class="sub" text-anchor="start">A → B    Book-carriers’ passage</text>
<text x="40" y="716" class="key" text-anchor="start">Leave the fork opposite Book Passage, turn behind 32 and enter 33.</text>
<text x="40" y="737" class="key" text-anchor="start">Walk out under the gallery and return to the fork by the west walk.</text>
<text x="590" y="692" class="sub" text-anchor="start">C → D    Candidates’ passage</text>
<text x="590" y="716" class="key" text-anchor="start">Turn away from the North Schools sign, skirt History and enter Latin.</text>
<text x="590" y="737" class="key" text-anchor="start">Leave through the ordinary lobby door and return along the north arcade.</text>
