<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 805" role="img" aria-labelledby="t d">
<title id="t">Library Court before and after the two passage reconnections</title>
<desc id="d">Matched ground plans, north up. A book-carriers' passage links the Book Office crossroads to the Old Library and west walk. A candidates' passage behind History links the northwest turn directly to Latin and its ordinary lobby entrance.</desc>
