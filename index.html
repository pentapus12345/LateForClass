<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LateForClass</title>
    <style>
        [hidden] {
            display: none !important;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1e2935;
            color: white;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #game-container canvas {
            display: block;
        }
        #objective {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 0.65rem 1rem;
            border-radius: 0.3rem;
            background-color: #15202beb;
            max-width: calc(100vw - 4rem);
            width: max-content;
            text-align: center;
            pointer-events: none;
        }
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-color: #141d29e8;
            text-align: center;
        }
        #view-status {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            margin: 0;
            padding: 0.45rem 0.65rem;
            border-radius: 0.3rem;
            background: #15202beb;
            pointer-events: none;
        }
        #start-screen h1 {
            margin: 0;
        }
        #screen-message {
            margin-bottom: 0;
        }
        #instructions {
            color: #d2dbe7;
            line-height: 1.6;
        }
        #start-button {
            padding: 0.65rem 1.4rem;
            font: inherit;
            font-weight: bold;
            color: #211707;
            background-color: #f0b765;
            border: 0;
            border-radius: 0.3rem;
            cursor: pointer;
        }
        #start-button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        #view-toggle {
            margin-top: 0.75rem;
            padding: 0.5rem 0.85rem;
            font: inherit;
            color: white;
            background: transparent;
            border: 1px solid #d2dbe7;
            border-radius: 0.3rem;
            cursor: pointer;
        }
        #start-button:focus-visible,
        #view-toggle:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }
        .level-picker-link {
            margin-top: 1rem;
            color: #f0b765;
        }
    </style>
</head>
<body>
    <main id="game-container">
        <p id="objective" role="status" hidden></p>
        <p id="view-status" role="status" hidden></p>
        <section id="start-screen" aria-labelledby="screen-title">
            <h1 id="screen-title">Late For Class</h1>
            <p id="screen-message" role="status">Loading the hallway…</p>
            <p id="instructions">WASD to move · Mouse to look · E when prompted<br>Escape to pause · R to restart</p>
            <button id="start-button" type="button" disabled>Start Game</button>
            <button id="view-toggle" type="button" hidden></button>
            <a class="level-picker-link" href="levels/">Choose a level</a>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="assets/gameConfig.js"></script>
    <script src="js/Wall.js"></script>
    <script src="js/Level.js"></script>
    <script src="js/Player.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
