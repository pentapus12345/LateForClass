<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late For Class</title>
    <style>
        [hidden] {
            display: none !important;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1e2935;
            color: white;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer canvas {
            display: block;
        }
        #objective {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 0.65rem 1rem;
            border-radius: 0.3rem;
            background-color: #15202beb;
            max-width: calc(100vw - 4rem);
            width: max-content;
            text-align: center;
            pointer-events: none;
        }
        #startScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-color: #141d29e8;
            text-align: center;
        }
        #startScreen h1 {
            margin: 0;
        }
        #screenMessage {
            margin-bottom: 0;
        }
        #instructions {
            color: #d2dbe7;
            line-height: 1.6;
        }
        #startButton {
            padding: 0.65rem 1.4rem;
            font: inherit;
            font-weight: bold;
            color: #211707;
            background-color: #f0b765;
            border: 0;
            border-radius: 0.3rem;
            cursor: pointer;
        }
        #startButton:disabled {
            opacity: 0.5;
            cursor: default;
        }
        #startButton:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main id="gameContainer">
        <p id="objective" role="status" hidden></p>
        <section id="startScreen" aria-labelledby="screenTitle">
            <h1 id="screenTitle">Late For Class</h1>
            <p id="screenMessage" role="status">Loading the hallway…</p>
            <p id="instructions">WASD to move · Mouse to look · E to enter<br>Escape to pause · R to restart</p>
            <button id="startButton" type="button" disabled>Start Game</button>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="assets/gameConfig.js"></script>
    <script src="js/wall.js"></script>
    <script src="js/Level.js"></script>
    <script src="js/player.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
